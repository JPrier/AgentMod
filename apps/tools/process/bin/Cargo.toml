[package]
name = "agentmod-process-host"
description = "AgentMod supervised process capability host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
agentmod-process-host-data = { version = "0.1.0", path = "../data" }
agentmod-process-host-dependency = { version = "0.1.0", path = "../dependency" }
agentmod-process-host-logic = { version = "0.1.0", path = "../logic" }
agentmod-process-host-service = { version = "0.1.0", path = "../service" }
agentmod-tool-protocol = { version = "0.1.0", path = "../../../../protocols/tool-protocol" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
agentmod-primitives = { version = "0.1.0", path = "../../../../core/primitives" }
agentmod-protocol-support = { version = "0.1.0", path = "../../../../core/protocol-support" }
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true

[lints]
workspace = true

[[bin]]
name = "agentmod-process-host"
path = "src/main.rs"

[package.metadata.agentmod]
kind = "composition-root"
process = "process"
