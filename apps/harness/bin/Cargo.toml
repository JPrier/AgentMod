[package]
name = "agentmod-harness"
description = "Native model-provider harness process for AgentMod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agentmod-harness-data = { version = "0.1.0", path = "../data" }
agentmod-harness-dependency = { version = "0.1.0", path = "../dependency" }
agentmod-harness-logic = { version = "0.1.0", path = "../logic" }
agentmod-harness-protocol = { version = "0.1.0", path = "../../../protocols/harness-protocol" }
agentmod-harness-service = { version = "0.1.0", path = "../service" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[lints]
workspace = true

[package.metadata.agentmod]
kind = "composition-root"
process = "harness"
