[package]
name = "agentmod-tui"
description = "First-class terminal frontend for AgentMod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agentmod-tui"
path = "src/main.rs"

[dependencies]
agentmod-protocol-support = { path = "../../../core/protocol-support" }
agentmod-tui-data = { path = "../data" }
agentmod-tui-dependency = { path = "../dependency" }
agentmod-tui-logic = { path = "../logic" }
agentmod-tui-service = { path = "../service" }

[lints]
workspace = true

[package.metadata.agentmod]
kind = "composition-root"
process = "tui"
