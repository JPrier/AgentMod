# AgentMod prototype — default deployment.
#
# Everything here is a plugin; the core ships no agent features. Session
# definitions list which plugins a session runs and the phases that order its
# blocking subscribers; the compiler derives every edge (`agentmod compile`
# prints the graph). Plugin commands run from this directory.
#
# There is no core loop limit: agent loops are cycles, reported by the
# compiler, and bounding them is plugin policy (see `budget`).

[runtime]
spill_threshold_bytes = 16384  # larger payloads spill to content-addressed files
max_attempts = 3               # orphan restarts before an invocation is failed

# --- frontends ---------------------------------------------------------------
[plugins.web-ui]
command = ["node", "plugins/web-ui/main.js"]
config = { port = 7700, host = "127.0.0.1", static_dir = "ui" }

# --- hooks / transformers ----------------------------------------------------
[plugins.redactor]
command = ["node", "plugins/redactor/main.js"]
module = "plugins/redactor/main.js"

[plugins.approval-gate]
command = ["node", "plugins/approval-gate/main.js"]
module = "plugins/approval-gate/main.js"
config = { require = ["delegate"] }

# Layered tool policy for coding sessions: deny > ask > allow across scopes,
# explained decisions, digest-bound approvals re-validated before execution,
# and tool visibility. Modes: auto | default | ask | read-only. In `default`,
# workspace reads and edits run; network, destructive, publishing, secret, and
# credential-file actions ask. See plugins/sdk/policy.js.
[plugins.policy]
command = ["node", "plugins/policy/main.js"]
module = "plugins/policy/main.js"
config = { mode = "default", approvers = ["web-ui"] }

# Questions to the user as event continuations (ask_user).
[plugins.ask-user]
command = ["node", "plugins/ask-user/main.js"]
module = "plugins/ask-user/main.js"

# Hard bounds for child agents (model requests, tool calls, tokens, wall time).
[plugins.budget]
command = ["node", "plugins/budget/main.js"]
module = "plugins/budget/main.js"
config = { max_model_requests = 40, max_wall_seconds = 1800 }

# The agent loop's bound per user message, for interactive sessions. The core
# has no loop or depth limit; this is the same budget plugin, configured as a
# per-turn limit (~500 model/tool rounds per message).
[plugins.loop-limit]
command = ["node", "plugins/budget/main.js"]
module = "plugins/budget/main.js"
config = { max_turn_model_requests = 500 }

# --- context + loop ----------------------------------------------------------
[plugins.chat-context]
command = ["node", "plugins/chat-context/main.js"]
module = "plugins/chat-context/main.js"

[plugins.titler]
command = ["node", "plugins/titler/main.js"]
module = "plugins/titler/main.js"

# update_plan: a tiny durable task list in session context.
[plugins.plan]
command = ["node", "plugins/plan/main.js"]
module = "plugins/plan/main.js"

# tool_search: deferred tools are found and loaded on demand, so their schemas
# do not ride along on every model request.
[plugins.tool-discovery]
command = ["node", "plugins/tool-discovery/main.js"]
module = "plugins/tool-discovery/main.js"

[plugins.memory]
command = ["node", "plugins/memory/main.js"]
module = "plugins/memory/main.js"

# --- model providers -----------------------------------------------------------
# OpenRouter is the model provider. A key is required: export OPENROUTER_API_KEY
# before `serve` (read from the environment, never written to the log). Without
# it the plugin refuses its handshake and the runtime will not start.
[plugins.openrouter-model]
command = ["node", "plugins/openrouter-model/main.js"]
module = "plugins/openrouter-model/main.js"
config = { model = "openai/gpt-4o-mini", api_key_env = "OPENROUTER_API_KEY", max_tokens = 4096 }

# Alternative LLM provider for any OpenAI-compatible endpoint (unused by default).
[plugins.openai-model]
command = ["node", "plugins/openai-model/main.js"]
module = "plugins/openai-model/main.js"
config = { base_url = "https://api.openai.com/v1", model = "gpt-4o-mini", api_key_env = "OPENAI_API_KEY" }

# --- tools ---------------------------------------------------------------------
[plugins.tool-clock]
command = ["node", "plugins/tool-clock/main.js"]
module = "plugins/tool-clock/main.js"

[plugins.tool-calc]
command = ["node", "plugins/tool-calc/main.js"]
module = "plugins/tool-calc/main.js"

[plugins.py-wordcount]
command = ["python3", "plugins/py-wordcount/main.py"]

[plugins.subagent]
command = ["node", "plugins/subagent/main.js"]
module = "plugins/subagent/main.js"
config = { definition = "worker", max_steps = 30, max_children = 8 }

[plugins.subagent-reporter]
command = ["node", "plugins/subagent-reporter/main.js"]
module = "plugins/subagent-reporter/main.js"

# --- coding: execution targets ---------------------------------------------------
# The coding tools (shell, process, read_file, list_dir, search_files,
# search_text, apply_patch, and deferred extras) are answered by whichever
# execution-target plugin a definition lists, the way a definition picks its
# model provider. Both share plugins/sdk/coding/. A definition may list both:
# each host disables the one it cannot run (the browser has no `command`
# plugins, the native runtime no `module`-only ones).
#
# linux-sandbox: an x86 Linux VM running inside the browser (CheerpX), on the
# user's own CPU and RAM. Browser runtime only — it has a `module` and no
# `command`, so the native runtime disables it.
[plugins.linux-sandbox]
module = "plugins/linux-sandbox/main.js"
timeout_ms = 1200000           # first boot streams the disk image; commands may run 15 min
config = { workspace = "default" }

# local-workspace: the same tools in a local directory, native runtime only.
# It is NOT a sandbox: commands run as you (with an allowlisted environment and
# no runtime secrets). The coder definitions pair it with `policy`.
[plugins.local-workspace]
command = ["node", "plugins/local-workspace/main.js"]
timeout_ms = 1900000
config = { root = ".agentmod/workspace" }

# Baseline for benchmarks: one shell tool, nothing else (see bench/).
[plugins.minimal-shell]
command = ["node", "plugins/minimal-shell/main.js"]
timeout_ms = 1900000
config = { root = ".agentmod/workspace" }

# The same provider, configured as a bare loop (no harness preamble, all
# tools every turn, no projection-side compaction) for the baseline.
[plugins.openrouter-minimal]
command = ["node", "plugins/openrouter-model/main.js"]
config = { model = "openai/gpt-4o-mini", api_key_env = "OPENROUTER_API_KEY", max_tokens = 4096, minimal = true }

# --- external capabilities (deferred tools, found through tool_search) ------------
# Network access: policy-gated (asks in default mode unless a rule allows the
# domain), output untrusted, private addresses refused.
[plugins.web-fetch]
command = ["node", "plugins/web-fetch/main.js"]
module = "plugins/web-fetch/main.js"
config = { max_bytes = 40000, timeout_seconds = 20 }

# MCP servers as tools (native). Add servers here, e.g.
#   [plugins.mcp-bridge.config.servers.github]
#   command = ["npx", "-y", "@modelcontextprotocol/server-github"]
#   env = { GITHUB_PERSONAL_ACCESS_TOKEN = "…" }
[plugins.mcp-bridge]
command = ["node", "plugins/mcp-bridge/main.js"]
timeout_ms = 600000
config = { servers = {} }

# Headless Chrome for validating web apps (native; needs Chrome or Chromium).
[plugins.browser-control]
command = ["node", "plugins/browser-control/main.js"]
timeout_ms = 120000

# --- triggers -------------------------------------------------------------------
[plugins.heartbeat]
command = ["node", "plugins/heartbeat/main.js"]
module = "plugins/heartbeat/main.js"
config = { every_seconds = 0, agent_every = 0, agent_definition = "chat" }

# --- session definitions ----------------------------------------------------------
#
# Phases order blocking subscribers (a phase is only a name). Every blocking
# subscriber gets a phase, per plugin or per event; wherever two subscribers
# in one phase could affect each other (one returns a key the other reads,
# both contribute context, or either can veto) the definition orders them.
# Plugins that offer tool specs at session start all contribute context in
# phase `offer`, hence the `session-started` / `config-applied` orders.
# `inbound` lists the events a session accepts from other sessions.

[definitions.chat]
description = "Interactive chat agent with tools, memory, approval, and sub-agents"
runtime = "0.1"
phases = ["offer", "intake", "guard", "loop"]

[definitions.chat.plugins]
web-ui = {}
redactor = { phase = "intake" }
approval-gate = { phase = "guard" }
loop-limit = { phase = "guard" }
chat-context = { phase = "loop" }
openrouter-model = {}
titler = {}
memory = { phase = "offer" }
tool-clock = { phase = "offer" }
tool-calc = { phase = "offer" }
py-wordcount = { phase = "offer" }
subagent = { phase = "offer" }

[definitions.chat.order.session-started]
offer = ["memory", "tool-clock", "tool-calc", "py-wordcount", "subagent"]

[definitions.chat.order.config-applied]
offer = ["memory", "tool-clock", "tool-calc", "py-wordcount", "subagent"]

[definitions.chat.inbound.subagent-result]
call_id = { shape = "string" }
text = { shape = "string" }
worker = { shape = "string" }
evidence = { shape = "object" }

[definitions.worker]
description = "Child agent started by `delegate`: scoped tools, budget, isolated workspace; reports back to its parent"
runtime = "0.1"
phases = ["offer", "intake", "guard", "loop"]

[definitions.worker.plugins]
web-ui = {}
policy = { phase = "guard" }
budget = { phase = "guard" }
chat-context = { phase = "loop" }
openrouter-model = {}
plan = { phase = "offer" }
tool-discovery = { phase = "offer", phases = { user-message = "intake" } }
linux-sandbox = { phase = "offer" }
local-workspace = { phase = "offer" }
tool-clock = { phase = "offer" }
tool-calc = { phase = "offer" }
subagent-reporter = {}

[definitions.worker.order.session-started]
offer = ["plan", "tool-discovery", "linux-sandbox", "local-workspace", "tool-clock", "tool-calc"]

[definitions.worker.order.config-applied]
offer = ["plan", "tool-discovery", "linux-sandbox", "local-workspace", "tool-clock", "tool-calc"]

# The budget can veto a model request; policy contributes the tool visibility.
[definitions.worker.order.model-request]
guard = ["budget", "policy"]

# The coding harness. In the browser the tools run in the Linux VM
# (linux-sandbox); natively they run in local-workspace's directory. The
# redactor rewrites user text, ask-user takes answers to open questions,
# tool-discovery loads tools a message asks for, policy decides tool calls and
# tool visibility, chat-context runs the loop.
[definitions.coder]
description = "Coding agent: plans, searches, edits with patches, runs builds/tests/servers, delegates, and can be rewound"
runtime = "0.1"
phases = ["offer", "intake", "guard", "loop"]

[definitions.coder.plugins]
web-ui = {}
redactor = { phase = "intake" }
ask-user = { phase = "offer", phases = { user-message = "intake" } }
policy = { phase = "guard" }
loop-limit = { phase = "guard" }
chat-context = { phase = "loop" }
openrouter-model = {}
titler = {}
plan = { phase = "offer" }
tool-discovery = { phase = "offer", phases = { user-message = "intake" } }
linux-sandbox = { phase = "offer" }
local-workspace = { phase = "offer" }
subagent = { phase = "offer" }
memory = { phase = "offer" }
web-fetch = { phase = "offer" }
mcp-bridge = { phase = "offer" }
browser-control = { phase = "offer" }

[definitions.coder.order.session-started]
offer = ["ask-user", "plan", "tool-discovery", "linux-sandbox", "local-workspace", "subagent", "memory", "web-fetch", "mcp-bridge", "browser-control"]

[definitions.coder.order.config-applied]
offer = ["ask-user", "plan", "tool-discovery", "linux-sandbox", "local-workspace", "subagent", "memory", "web-fetch", "mcp-bridge", "browser-control"]

[definitions.coder.order.user-message]
intake = ["redactor", "ask-user", "tool-discovery"]

# The loop limit can veto a model request; policy contributes the tool visibility.
[definitions.coder.order.model-request]
guard = ["loop-limit", "policy"]

[definitions.coder.inbound.subagent-result]
call_id = { shape = "string" }
text = { shape = "string" }
worker = { shape = "string" }
evidence = { shape = "object" }

# Benchmark baseline: model → shell → result → model, nothing else.
[definitions.minimal]
description = "Baseline loop for benchmarks: a provider, the chat loop, and one shell tool"
runtime = "0.1"
phases = ["offer", "loop"]

[definitions.minimal.plugins]
web-ui = {}
chat-context = { phase = "loop" }
openrouter-minimal = {}
minimal-shell = { phase = "offer" }

[definitions.heartbeat]
description = "Journal session for the heartbeat trigger (one record per fire)"
runtime = "0.1"

[definitions.heartbeat.plugins]
web-ui = {}
heartbeat = {}
