# Standalone workspace for the High-Level Design prototype.
# Intentionally separate from the root workspace so it neither depends on nor
# constrains the existing implementation (see ../docs/design/high-level-design.md).
[workspace]
resolver = "3"
members = ["crates/agentmod-core", "crates/agentmod-runtime", "crates/agentmod-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JPrier/AgentMod"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release.package.agentmod-wasm]
opt-level = "s"
