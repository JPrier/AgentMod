[package]
name = "agentmod-plugin-host"
description = "Isolated third-party plugin host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agentmod-plugin-host-data = { path = "../data" }
agentmod-plugin-host-dependency = { path = "../dependency" }
agentmod-plugin-host-logic = { path = "../logic" }
agentmod-plugin-host-service = { path = "../service" }
agentmod-plugin-protocol = { path = "../../../protocols/plugin-protocol" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[lints]
workspace = true

[package.metadata.agentmod]
kind = "composition-root"
process = "plugin-host"
