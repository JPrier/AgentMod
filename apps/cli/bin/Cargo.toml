[package]
name = "agentmod-cli"
description = "Headless command-line frontend for AgentMod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agentmod"
path = "src/main.rs"

[dependencies]
agentmod-cli-data = { version = "0.1.0", path = "../data" }
agentmod-cli-dependency = { version = "0.1.0", path = "../dependency" }
agentmod-cli-logic = { version = "0.1.0", path = "../logic" }
agentmod-cli-service = { version = "0.1.0", path = "../service" }
agentmod-protocol-support = { version = "0.1.0", path = "../../../core/protocol-support" }

[lints]
workspace = true

[package.metadata.agentmod]
kind = "composition-root"
process = "cli"
