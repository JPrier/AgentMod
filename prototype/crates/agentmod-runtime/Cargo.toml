[package]
name = "agentmod-runtime"
description = "Native AgentMod prototype runtime: plugin supervision, durable logs, recovery"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agentmod"
path = "src/main.rs"

[dependencies]
agentmod-core = { path = "../agentmod-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
