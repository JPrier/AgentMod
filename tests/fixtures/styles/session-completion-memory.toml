schema_version = 1
kind = "custom"
required_capabilities = ["approval", "artifacts"]
allowed_tool_groups = []
allowed_providers = []
allowed_plugins = ["runtime.security"]

[identity]
id = "e2e-session-completion-memory"
version = "1.0.0"
runtime_api = "^1.0"

[graph]
kind = "inline"
source = '''
format_version = 1
entry = "save-result"

[budget]
max_steps = 4
max_tokens = 1
max_cost_micros = 1
max_duration_ms = 10000

[declarations]
capabilities = ["artifacts"]
providers = []

[[nodes]]
id = "save-result"
kind = "persist_artifact"
configuration = { type = "persist_artifact", content = { kind = "static_json", value = { result = "terminal evidence" } }, mime_type = "application/json", security = "private", retention = "session" }

[[nodes]]
id = "finish"
kind = "complete_session"

[[edges]]
from = "save-result"
to = "finish"
'''

[[interceptors]]
id = "runtime-style-policy"
owner = "runtime.security"
event = "action.proposed"
stage = 10
priority = 100
before = []
after = []
supported_decisions = [
  "continue",
  "replace",
  "reject",
  "require_approval",
  "cancel",
]
required_capabilities = ["approval"]

[memory]
provider = "file"
scopes = ["session"]
retrieval_timing = "before_model_request"
max_items = 8
max_injected_bytes = 16384
write_policy = "session_completion"
injection_location = "before_current_input"

[memory.query]
source = "current_input"
include_active_artifacts = true
include_style_context = false
max_query_bytes = 1024

[compaction]
strategy = "none"
reserved_context_tokens = 0
max_provider_projection_tokens = 0
preserve_unresolved_tasks = true
preserve_active_processes = true
preservation_requirements = [
  "system_instructions",
  "current_input",
  "pending_control_state",
  "artifact_references",
  "memory_provenance",
  "active_graph_state",
  "tool_call_correlation",
]

[approvals]
default = "allow"
groups = {}

[budgets]
max_iterations = 1
max_steps = 4
max_tokens = 1
max_cost_micros = 1
max_duration_ms = 10000

[child_agents]
max_children = 0
max_concurrent = 0
max_depth = 0
per_child_token_budget = 0

[retry]
max_attempts = 1
initial_backoff_ms = 0
max_backoff_ms = 0
retryable_failures = []

[termination]
allowed_outcomes = ["complete_session", "fail"]
on_hard_limit = "fail"
require_explicit_terminal_node = true

[selection]
requires_explicit_selection = true
model_may_select = false
