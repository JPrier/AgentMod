schema_version = 1
kind = "custom"
required_capabilities = ["agents", "artifacts", "context", "events", "model", "plugin.graph", "tools"]
allowed_tool_groups = ["filesystem"]
allowed_providers = ["deterministic-mock"]
allowed_plugins = ["fixture.node"]

[identity]
id = "user-graph-c"
version = "1.0.0"
runtime_api = "^1.0"

[harness]
id = "native"
required_capabilities = [
  "cancellation",
  "streaming",
  "structured_context_replacement",
  "token_usage",
  "tool_calls",
]

[graph]
kind = "inline"
source = '''
format_version = 1
entry = "runtime_context"

[budget]
max_steps = 16
max_tokens = 1000
max_cost_micros = 100000
max_duration_ms = 10000

[declarations]
capabilities = ["agents", "artifacts", "context", "events", "model", "plugin.graph", "tools"]
tools = ["filesystem.read"]
providers = ["deterministic-mock"]
plugins = ["fixture.node"]
events = ["user.graph_c.parallel_runtime"]

[[variables]]
name = "seed_artifact"
type = { kind = "artifact_reference" }
scope = "run"
producer = "seed_artifact"
consumers = ["renamed_plugin"]
mutability = "immutable"
max_size_bytes = 512
security_classification = "internal"

[[nodes]]
id = "runtime_context"
kind = "context_transform"
configuration = { type = "context_transform", strategy = "preserve_history" }

[[nodes]]
id = "seed_artifact"
kind = "persist_artifact"
write_variables = ["seed_artifact"]
configuration = { type = "persist_artifact", content = { kind = "static_json", value = { graph = "C", evidence = "plugin-parallel" } }, mime_type = "application/json", security = "private", retention = "session" }

[[nodes]]
id = "plugin_fanout"
kind = "parallel_branch"
configuration = { type = "parallel_branch", max_parallelism = 2, max_queue_depth = 2, join_target = "renamed_done", join_policy = "all" }

[[nodes]]
id = "renamed_plugin"
kind = "model_call"
provider = "deterministic-mock"
required_capabilities = ["plugin.graph"]
read_variables = ["seed_artifact"]
configuration = { type = "plugin", plugin_id = "fixture.node", executor_id = "fixture.graph", executor_version = "1.0.0", node_kind = "model_call", input_schema = "fixture.graph.input", output_schema = "fixture.graph.output", configuration_reference = "fixture.graph.config", input = { value = "arbitrary-user-graph-c" } }

[[nodes]]
id = "parallel_runtime_event"
kind = "emit_event"
configuration = { type = "emit_event", event_type = "user.graph_c.parallel_runtime", payload = { branch = "runtime" }, metadata = { graph = "C" } }

[[nodes]]
id = "renamed_done"
kind = "join_results"
configuration = { type = "join_results", required = ["plugin", "runtime"], minimum_successes = 2, failure_policy = "fail_fast", ordering_policy = "member_id", timeout_ms = 10000, cancellation_propagates = true, result_projection = "node_references", artifact_collection = "all" }

[[nodes]]
id = "terminal_done"
kind = "complete_turn"

[[edges]]
from = "runtime_context"
to = "seed_artifact"

[[edges]]
from = "seed_artifact"
to = "plugin_fanout"

[[edges]]
from = "plugin_fanout"
to = "renamed_plugin"
label = "plugin"

[[edges]]
from = "plugin_fanout"
to = "parallel_runtime_event"
label = "runtime"

[[edges]]
from = "renamed_plugin"
to = "renamed_done"

[[edges]]
from = "parallel_runtime_event"
to = "renamed_done"

[[edges]]
from = "renamed_done"
to = "terminal_done"
'''

[memory]
provider = "none"
scopes = []
retrieval_timing = "never"
max_items = 0
max_injected_bytes = 0
write_policy = "never"
injection_location = "none"

[memory.query]
source = "current_input"
include_active_artifacts = false
include_style_context = false
max_query_bytes = 16384

[compaction]
strategy = "none"
reserved_context_tokens = 0
max_provider_projection_tokens = 0
preserve_unresolved_tasks = true
preserve_active_processes = true
preservation_requirements = [
  "system_instructions",
  "current_input",
  "pending_control_state",
  "artifact_references",
  "memory_provenance",
  "active_graph_state",
  "tool_call_correlation",
]

[approvals]
default = "allow"
groups = {}

[budgets]
max_iterations = 1
max_steps = 16
max_tokens = 1000
max_cost_micros = 100000
max_duration_ms = 10000

[child_agents]
max_children = 0
max_concurrent = 0
max_depth = 0
per_child_token_budget = 0

[retry]
max_attempts = 1
initial_backoff_ms = 10
max_backoff_ms = 10
retryable_failures = []

[termination]
allowed_outcomes = ["complete_turn", "fail"]
on_hard_limit = "fail"
require_explicit_terminal_node = true

[selection]
requires_explicit_selection = true
model_may_select = false
