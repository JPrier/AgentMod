schema_version = 1
kind = "custom"
required_capabilities = ["approval", "scheduling"]
allowed_tool_groups = []
allowed_providers = ["deterministic-mock"]
allowed_plugins = ["runtime.security"]

[identity]
id = "user-graph-schedule"
version = "1.0.0"
runtime_api = "^1.0"

[harness]
id = "native"
required_capabilities = [
  "cancellation",
  "streaming",
  "structured_context_replacement",
  "token_usage",
  "tool_calls",
]

[graph]
kind = "inline"
source = '''
format_version = 1
entry = "await-wake"

[budget]
max_steps = 8
max_tokens = 1000
max_cost_micros = 100000
max_duration_ms = 60000

[declarations]
capabilities = ["approval", "scheduling"]
providers = ["deterministic-mock"]

[[nodes]]
id = "await-wake"
kind = "schedule"
configuration = { type = "schedule", trigger = { kind = "at", timestamp = "2099-01-01T00:00:00Z" }, wait_for_trigger = true, cancellation = "cancel_trigger" }

[[nodes]]
id = "finish"
kind = "complete_session"

[[edges]]
from = "await-wake"
to = "finish"
'''

[[interceptors]]
id = "runtime-style-policy"
owner = "runtime.security"
event = "action.proposed"
stage = 10
priority = 100
before = []
after = []
supported_decisions = [
  "continue",
  "replace",
  "reject",
  "require_approval",
  "cancel",
]
required_capabilities = []

[memory]
provider = "none"
scopes = []
retrieval_timing = "never"
max_items = 0
max_injected_bytes = 0
write_policy = "never"
injection_location = "none"

[memory.query]
source = "current_input"
include_active_artifacts = false
include_style_context = false
max_query_bytes = 16384

[compaction]
strategy = "none"
reserved_context_tokens = 0
max_provider_projection_tokens = 0
preserve_unresolved_tasks = true
preserve_active_processes = true
preservation_requirements = [
  "system_instructions",
  "current_input",
  "pending_control_state",
  "artifact_references",
  "memory_provenance",
  "active_graph_state",
  "tool_call_correlation",
]

[approvals]
default = "allow"
groups = {}

[budgets]
max_iterations = 1
max_steps = 8
max_tokens = 1000
max_cost_micros = 100000
max_duration_ms = 60000

[child_agents]
max_children = 0
max_concurrent = 0
max_depth = 0
per_child_token_budget = 0

[retry]
max_attempts = 1
initial_backoff_ms = 10
max_backoff_ms = 10
retryable_failures = []

[termination]
allowed_outcomes = ["complete_session", "fail"]
on_hard_limit = "fail"
require_explicit_terminal_node = true

[selection]
requires_explicit_selection = true
model_may_select = false
