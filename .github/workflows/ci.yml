name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --all-features --locked 2>&1 | tee test-output.log
      - name: Surface failing tests as annotations
        if: failure()
        shell: bash
        run: |
          # Make failures readable from the checks UI and API without the raw log.
          grep -nE "^test .* FAILED|panicked at|^---- .* stdout ----|^error(\[|:)|assertion .* failed|left:|right:" test-output.log \
            | head -n 40 | while IFS= read -r line; do echo "::error title=cargo test::${line}"; done || true
      - name: Documentation tests
        run: cargo test --workspace --doc --all-features --locked

  architecture:
    name: Architecture and negative fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate workspace dependency graph
        run: cargo run --locked -p xtask -- architecture --manifest-path Cargo.toml
      - name: Prove intentional violations are detected
        run: cargo test --locked -p xtask --test architecture

  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: Check each declared feature
        run: cargo hack check --workspace --each-feature --all-targets
      - name: Check all features together
        run: cargo check --workspace --all-targets --all-features --locked

  msrv:
    name: Declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on declared minimum Rust
        run: cargo check --workspace --all-targets --all-features --locked

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: License, ban, advisory, and source policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: RustSec advisory audit
        run: cargo audit

  packaging-smoke:
    name: Packaging smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The runtime spawns its sibling hosts (scheduler, harness, tool and
      # plugin hosts), so every workspace binary must be built.
      - name: Build release binaries
        run: cargo build --locked --release --workspace --bins
      - name: Runtime ↔ harness smoke
        shell: bash
        run: |
          set -euo pipefail
          output=$(target/release/agentmod-runtime harness-smoke)
          echo "$output"
          grep -q '"status":"ok"' <<<"$output"
      - name: Daemon + CLI doctor smoke
        shell: bash
        env:
          AGENTMOD_RUNTIME_AUTH_TOKEN: packaging-smoke-0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          bin="$PWD/target/release"
          work=$(mktemp -d)
          # Unix sockets need a short path; Windows uses its default named pipe.
          if [[ "$RUNNER_OS" != "Windows" ]]; then export AGENTMOD_RUNTIME_ENDPOINT="$work/rt.sock"; fi
          (cd "$work" && exec "$bin/agentmod-runtime" serve > "$work/serve.log" 2>&1) &
          daemon=$!
          trap 'kill $daemon 2>/dev/null || true; cat "$work/serve.log"' EXIT
          for _ in $(seq 1 100); do "$bin/agentmod" doctor --json >/dev/null 2>&1 && break; sleep 0.2; done
          "$bin/agentmod" doctor --json --strict
