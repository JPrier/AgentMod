[package]
name = "agentmod-browser-host"
description = "Isolated managed-browser capability host for AgentMod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agentmod-browser-host"
path = "src/main.rs"

[dependencies]
agentmod-browser-host-data = { version = "0.1.0", path = "../data" }
agentmod-browser-host-dependency = { version = "0.1.0", path = "../dependency" }
agentmod-browser-host-logic = { version = "0.1.0", path = "../logic" }
agentmod-browser-host-service = { version = "0.1.0", path = "../service" }
agentmod-tool-protocol = { version = "0.1.0", path = "../../../../protocols/tool-protocol" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[lints]
workspace = true

[package.metadata.agentmod]
kind = "composition-root"
process = "browser"
