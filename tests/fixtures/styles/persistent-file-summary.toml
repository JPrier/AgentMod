schema_version = 1
kind = "custom"
required_capabilities = ["approval", "model", "tools"]
allowed_tool_groups = ["filesystem"]
allowed_providers = ["mock"]
allowed_plugins = ["runtime.security"]

[identity]
id = "e2e-persistent-summary"
version = "1.0.0"
runtime_api = "^1.0"

[graph]
kind = "inline"
source = '''
format_version = 1
entry = "respond"

[budget]
max_steps = 100
max_tokens = 250000
max_cost_micros = 25000000
max_duration_ms = 900000

[declarations]
capabilities = ["model", "tools"]
tools = ["filesystem.read"]
providers = ["mock"]

[[nodes]]
id = "respond"
kind = "model_call"
provider = "mock"
retry_limit = 1

[[nodes]]
id = "tool"
kind = "tool_execution_gate"
tool = "filesystem.read"
read_scopes = ["workspace"]

[[nodes]]
id = "done"
kind = "complete_turn"

[[edges]]
from = "respond"
to = "tool"

[[edges]]
from = "tool"
to = "done"
'''

[[interceptors]]
id = "runtime-style-policy"
owner = "runtime.security"
event = "action.proposed"
stage = 10
priority = 100
before = []
after = []
supported_decisions = [
  "continue",
  "replace",
  "reject",
  "require_approval",
  "cancel",
]
required_capabilities = ["approval"]

[memory]
provider = "file"
scopes = ["session"]
retrieval_timing = "before_model_request"
max_items = 8
max_injected_bytes = 16384
write_policy = "explicit_only"
injection_location = "before_current_input"

[memory.query]
source = "current_input"
include_active_artifacts = false
include_style_context = false
max_query_bytes = 16384

[compaction]
strategy = "summary"
trigger_tokens = 250
reserved_context_tokens = 128
max_provider_projection_tokens = 4096
preserve_unresolved_tasks = true
preserve_active_processes = true
preservation_requirements = [
  "system_instructions",
  "current_input",
  "pending_control_state",
  "artifact_references",
  "memory_provenance",
  "active_graph_state",
  "tool_call_correlation",
]

[approvals]
default = "ask"
groups = { "filesystem.read" = "allow" }

[budgets]
max_iterations = 8
max_steps = 100
max_tokens = 250000
max_cost_micros = 25000000
max_duration_ms = 900000

[child_agents]
max_children = 0
max_concurrent = 0
max_depth = 0
per_child_token_budget = 0

[retry]
max_attempts = 2
initial_backoff_ms = 0
max_backoff_ms = 0
retryable_failures = ["provider.unavailable"]

[termination]
allowed_outcomes = ["complete_turn", "fail"]
on_hard_limit = "fail"
require_explicit_terminal_node = true

[selection]
requires_explicit_selection = true
model_may_select = false
