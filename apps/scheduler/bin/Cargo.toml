[package]
name = "agentmod-scheduler"
description = "Isolated durable scheduler worker for AgentMod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "agentmod-scheduler"
path = "src/main.rs"

[dependencies]
agentmod-scheduler-data = { version = "0.1.0", path = "../data" }
agentmod-scheduler-dependency = { version = "0.1.0", path = "../dependency" }
agentmod-scheduler-logic = { version = "0.1.0", path = "../logic" }
agentmod-scheduler-protocol = { version = "0.1.0", path = "../../../protocols/scheduler-protocol" }
agentmod-scheduler-service = { version = "0.1.0", path = "../service" }
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.agentmod]
kind = "composition-root"
process = "scheduler"
