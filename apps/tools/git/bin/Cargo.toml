[package]
name = "agentmod-git-host"
description = "AgentMod isolated Git capability host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agentmod-git-host-data = { version = "0.1.0", path = "../data" }
agentmod-git-host-dependency = { version = "0.1.0", path = "../dependency" }
agentmod-git-host-logic = { version = "0.1.0", path = "../logic" }
agentmod-git-host-service = { version = "0.1.0", path = "../service" }
agentmod-tool-protocol = { version = "0.1.0", path = "../../../../protocols/tool-protocol" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }

[lints]
workspace = true

[[bin]]
name = "agentmod-git-host"
path = "src/main.rs"

[package.metadata.agentmod]
kind = "composition-root"
process = "git"
